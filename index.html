<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💕 Do You Love Me, Sujju? 💕</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;600&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a0011 0%, #2d0a1e 25%, #4a0e2e 50%, #2d0a1e 75%, #1a0011 100%);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Floating hearts background */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            font-size: 1.5rem;
            opacity: 0.15;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(110vh) rotate(0deg) scale(1);
                opacity: 0;
            }

            10% {
                opacity: 0.15;
            }

            90% {
                opacity: 0.15;
            }

            100% {
                transform: translateY(-10vh) rotate(360deg) scale(0.5);
                opacity: 0;
            }
        }

        /* Glowing orbs */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: orbPulse 6s ease-in-out infinite alternate;
        }

        .glow-orb:nth-child(1) {
            width: 300px;
            height: 300px;
            background: rgba(255, 20, 80, 0.15);
            top: 20%;
            left: 10%;
        }

        .glow-orb:nth-child(2) {
            width: 250px;
            height: 250px;
            background: rgba(255, 100, 150, 0.12);
            bottom: 15%;
            right: 15%;
            animation-delay: 2s;
        }

        .glow-orb:nth-child(3) {
            width: 200px;
            height: 200px;
            background: rgba(200, 50, 100, 0.1);
            top: 50%;
            left: 50%;
            animation-delay: 4s;
        }

        @keyframes orbPulse {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }

            100% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        /* ===== Main card - BIGGER ===== */
        .card {
            position: relative;
            z-index: 10;
            background: linear-gradient(145deg, rgba(60, 10, 35, 0.85), rgba(30, 5, 20, 0.95));
            border: 1px solid rgba(255, 80, 130, 0.2);
            border-radius: 36px;
            padding: 60px 80px 65px;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow:
                0 0 60px rgba(255, 50, 100, 0.15),
                0 25px 60px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 150, 180, 0.1);
            max-width: 620px;
            width: 92%;
            animation: cardEntry 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(40px) scale(0.95);
        }

        @keyframes cardEntry {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .heart-icon {
            font-size: 5rem;
            margin-bottom: 12px;
            display: inline-block;
            animation: heartBeat 1.2s ease-in-out infinite;
        }

        @keyframes heartBeat {

            0%,
            100% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.15);
            }

            30% {
                transform: scale(1);
            }

            45% {
                transform: scale(1.1);
            }
        }

        .question {
            font-family: 'Dancing Script', cursive;
            font-size: 3.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            text-shadow: 0 0 30px rgba(255, 100, 150, 0.4);
            line-height: 1.3;
        }

        .name-highlight {
            color: #ff6b8a;
            text-shadow: 0 0 20px rgba(255, 107, 138, 0.5);
        }

        .subtitle {
            font-size: 1rem;
            color: rgba(255, 180, 200, 0.6);
            margin-bottom: 45px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ===== Buttons ===== */
        .buttons-container {
            display: flex;
            gap: 50px;
            justify-content: center;
            align-items: center;
        }

        .btn {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        /* YES button */
        .btn-yes {
            background: linear-gradient(135deg, #ff3366, #ff6b8a, #ff3366);
            background-size: 200% 200%;
            animation: shimmer 3s ease-in-out infinite;
            color: #fff;
            box-shadow:
                0 0 30px rgba(255, 51, 102, 0.4),
                0 8px 25px rgba(255, 51, 102, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        @keyframes shimmer {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .btn-yes:hover {
            transform: scale(1.12);
            box-shadow:
                0 0 50px rgba(255, 51, 102, 0.6),
                0 12px 35px rgba(255, 51, 102, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-yes:active {
            transform: scale(1.05);
        }

        .btn-yes .btn-icon {
            font-size: 1.8rem;
            margin-bottom: 2px;
        }

        /* NO button */
        .btn-no {
            background: linear-gradient(135deg, #3a3a4a, #2a2a3a);
            color: rgba(255, 255, 255, 0.7);
            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            z-index: 100;
        }

        .btn-no .btn-icon {
            font-size: 1.4rem;
            margin-bottom: 2px;
        }

        /* Counter / funny message */
        .attempt-counter {
            margin-top: 30px;
            font-size: 0.9rem;
            color: rgba(255, 150, 180, 0.4);
            min-height: 24px;
            transition: opacity 0.3s;
        }

        /* ===== Celebration screen ===== */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: linear-gradient(135deg, #1a0011, #3d0a25, #1a0011);
            animation: celebFadeIn 0.6s ease forwards;
        }

        .celebration.active {
            display: flex;
        }

        @keyframes celebFadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .celeb-text {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 0 40px rgba(255, 100, 150, 0.6);
            animation: celebPop 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: scale(0.5);
            text-align: center;
            padding: 0 20px;
        }

        @keyframes celebPop {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .celeb-sub {
            font-size: 1.5rem;
            color: rgba(255, 180, 200, 0.8);
            margin-top: 15px;
            animation: celebPop 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
            opacity: 0;
            transform: scale(0.5);
        }

        .celeb-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .burst-heart {
            position: absolute;
            font-size: 2rem;
            animation: burstFloat 3s ease-out forwards;
            opacity: 0;
        }

        @keyframes burstFloat {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0) rotate(0deg);
            }

            50% {
                opacity: 1;
                transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(180deg);
            }

            100% {
                opacity: 0;
                transform: translate(var(--dx2), var(--dy2)) scale(0.5) rotate(360deg);
            }
        }

        /* Sparkle particles */
        .sparkle {
            position: fixed;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #ff6b8a;
            pointer-events: none;
            z-index: 100;
            animation: sparkleAnim 0.6s ease-out forwards;
        }

        @keyframes sparkleAnim {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 500px) {
            .card {
                padding: 40px 30px 45px;
                border-radius: 28px;
            }

            .question {
                font-size: 2.4rem;
            }

            .heart-icon {
                font-size: 3.5rem;
            }

            .btn {
                width: 90px;
                height: 90px;
                font-size: 1rem;
            }

            .celeb-text {
                font-size: 2.8rem;
            }

            .buttons-container {
                gap: 35px;
            }
        }
    </style>
</head>

<body>

    <!-- Background effects -->
    <div class="glow-orb"></div>
    <div class="glow-orb"></div>
    <div class="glow-orb"></div>

    <div class="hearts-bg" id="heartsBg"></div>

    <!-- Main card -->
    <div class="card" id="card">
        <div class="heart-icon">💖</div>
        <h1 class="question">Hey <span class="name-highlight">Sujju</span>,<br>Do You Love Me?</h1>
        <p class="subtitle">choose wisely ✨</p>

        <div class="buttons-container">
            <button class="btn btn-yes" id="btnYes" onclick="sayYes()">
                <span class="btn-icon">💕</span>
                Yes
            </button>
            <button class="btn btn-no" id="btnNo">
                <span class="btn-icon">💔</span>
                No
            </button>
        </div>

        <div class="attempt-counter" id="counter"></div>
    </div>

    <!-- Celebration overlay -->
    <div class="celebration" id="celebration">
        <div class="celeb-hearts" id="celebHearts"></div>
        <div class="celeb-text">I Knew It, Sujju! 💖</div>
        <div class="celeb-sub">Happy Valentine's Day! 🌹</div>
    </div>

    <script>
        // ===== Floating background hearts =====
        const heartsBg = document.getElementById('heartsBg');
        const heartEmojis = ['💕', '💖', '💗', '💘', '💝', '♥️', '❤️', '🩷', '🌹'];

        function createFloatingHeart() {
            const heart = document.createElement('span');
            heart.className = 'floating-heart';
            heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.fontSize = (Math.random() * 1.5 + 0.8) + 'rem';
            heart.style.animationDuration = (Math.random() * 10 + 12) + 's';
            heart.style.animationDelay = (Math.random() * 5) + 's';
            heartsBg.appendChild(heart);
            setTimeout(() => heart.remove(), 22000);
        }

        for (let i = 0; i < 15; i++) {
            setTimeout(createFloatingHeart, i * 400);
        }
        setInterval(createFloatingHeart, 2000);

        // ===== No button evasion logic =====
        const btnNo = document.getElementById('btnNo');
        const counter = document.getElementById('counter');
        let attempts = 0;
        let movedToBody = false;

        const funnyMessages = [
            "Nice try, Sujju! 😏",
            "Nope, not happening! 😂",
            "Keep trying... 🤭",
            "You can't catch me! 💨",
            "Almost! ...not really 😝",
            "The answer is YES, Sujju! 💕",
            "Give up already! 😘",
            "I'm too fast for you! 🏃",
            "Just click Yes! 🥺",
            "Wrong button, Sujju! 💖",
            "I'll keep running! 🏃‍♂️💨",
            "You know you want to click Yes! 😍",
            "Resistance is futile! 💘",
            "Stop playing hard to get! 😜",
            "That button is off limits! 🚫"
        ];

        function getRandomPosition() {
            const btnSize = 110;
            // Use very generous safe margins so button is always fully visible
            const safeMargin = 60;
            const viewW = window.innerWidth;
            const viewH = window.innerHeight;

            // Strict clamping: button must be fully within viewport
            const minX = safeMargin;
            const maxX = viewW - btnSize - safeMargin;
            const minY = safeMargin;
            const maxY = viewH - btnSize - safeMargin;

            const x = Math.floor(Math.random() * (maxX - minX)) + minX;
            const y = Math.floor(Math.random() * (maxY - minY)) + minY;

            // Double-check clamp
            return {
                x: Math.max(safeMargin, Math.min(x, viewW - btnSize - safeMargin)),
                y: Math.max(safeMargin, Math.min(y, viewH - btnSize - safeMargin))
            };
        }

        function moveNoButton(e) {
            e.preventDefault();
            e.stopPropagation();
            attempts++;

            // On first move, reparent the button to <body> so no parent can clip/hide it
            if (!movedToBody) {
                movedToBody = true;
                document.body.appendChild(btnNo);
            }

            const pos = getRandomPosition();

            // Set fixed positioning on the body
            btnNo.style.position = 'fixed';
            btnNo.style.left = pos.x + 'px';
            btnNo.style.top = pos.y + 'px';
            btnNo.style.zIndex = '500';
            btnNo.style.transition = 'left 0.25s ease-out, top 0.25s ease-out';

            // Force the button to ALWAYS be visible
            btnNo.style.display = 'flex';
            btnNo.style.opacity = '1';
            btnNo.style.visibility = 'visible';
            btnNo.style.pointerEvents = 'auto';
            btnNo.style.width = '110px';
            btnNo.style.height = '110px';
            btnNo.style.transform = 'none';

            // Show funny message
            const msg = funnyMessages[attempts % funnyMessages.length];
            counter.textContent = msg;
            counter.style.opacity = '1';
            counter.style.color = 'rgba(255, 150, 180, 0.7)';

            // Spawn sparkles
            const cx = e.clientX || e.touches?.[0]?.clientX || pos.x + 55;
            const cy = e.clientY || e.touches?.[0]?.clientY || pos.y + 55;
            spawnSparkles(cx, cy);

            // Grow the Yes button slightly each time
            const yesBtn = document.getElementById('btnYes');
            const scale = Math.min(1.3, 1 + attempts * 0.015);
            yesBtn.style.transform = `scale(${scale})`;
        }

        // Desktop: move on hover and click
        btnNo.addEventListener('mouseenter', moveNoButton);
        btnNo.addEventListener('click', moveNoButton);

        // Mobile: move on touch
        btnNo.addEventListener('touchstart', moveNoButton, { passive: false });

        // ===== Sparkle effect =====
        function spawnSparkles(x, y) {
            for (let i = 0; i < 8; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                const angle = (Math.PI * 2 / 8) * i;
                const dist = Math.random() * 50 + 20;
                sparkle.style.left = (x + Math.cos(angle) * dist) + 'px';
                sparkle.style.top = (y + Math.sin(angle) * dist) + 'px';
                sparkle.style.background = ['#ff3366', '#ff6b8a', '#ff99b3', '#ffccdd', '#fff'][Math.floor(Math.random() * 5)];
                sparkle.style.width = sparkle.style.height = (Math.random() * 4 + 2) + 'px';
                document.body.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 600);
            }
        }

        // ===== Yes button celebration =====
        function sayYes() {
            const celebration = document.getElementById('celebration');
            celebration.classList.add('active');

            // Only hide No button during celebration
            btnNo.style.display = 'none';

            // Burst hearts
            const celebHearts = document.getElementById('celebHearts');
            const burstEmojis = ['💖', '💕', '💗', '💘', '💝', '❤️', '🌹', '✨', '💐', '🩷'];

            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const heart = document.createElement('span');
                    heart.className = 'burst-heart';
                    heart.textContent = burstEmojis[Math.floor(Math.random() * burstEmojis.length)];

                    const startX = window.innerWidth / 2;
                    const startY = window.innerHeight / 2;
                    heart.style.left = startX + 'px';
                    heart.style.top = startY + 'px';
                    heart.style.fontSize = (Math.random() * 2 + 1.5) + 'rem';

                    const dx = (Math.random() - 0.5) * window.innerWidth * 0.8;
                    const dy = (Math.random() - 0.5) * window.innerHeight * 0.8;
                    heart.style.setProperty('--dx', dx + 'px');
                    heart.style.setProperty('--dy', dy + 'px');
                    heart.style.setProperty('--dx2', dx * 1.5 + 'px');
                    heart.style.setProperty('--dy2', dy * 1.5 - 100 + 'px');
                    heart.style.animationDelay = '0s';

                    celebHearts.appendChild(heart);
                    setTimeout(() => heart.remove(), 3000);
                }, i * 70);
            }
        }

        // Prevent right-click on No button
        btnNo.addEventListener('contextmenu', (e) => e.preventDefault());

        // VISIBILITY ENFORCER: Every 500ms, guarantee the No button is visible
        setInterval(() => {
            const celebActive = document.getElementById('celebration').classList.contains('active');
            if (celebActive) return; // Only hide during celebration

            // Force visibility
            btnNo.style.display = 'flex';
            btnNo.style.opacity = '1';
            btnNo.style.visibility = 'visible';
            btnNo.style.pointerEvents = 'auto';

            // If button has been moved, check it's still within viewport
            if (movedToBody) {
                const rect = btnNo.getBoundingClientRect();
                const viewW = window.innerWidth;
                const viewH = window.innerHeight;

                // If button is out of bounds, bring it back
                if (rect.left < 0 || rect.top < 0 || rect.right > viewW || rect.bottom > viewH) {
                    const pos = getRandomPosition();
                    btnNo.style.left = pos.x + 'px';
                    btnNo.style.top = pos.y + 'px';
                }
            }
        }, 500);
    </script>
</body>

</html>
